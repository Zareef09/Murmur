<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-base);color:var(--text-primary);font:var(--type-body)}.row{display:flex;gap:12px}.card{flex:1;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--line-hairline)}.card b{display:block;font:var(--type-caption);font-weight:500}.card s{font:var(--type-meta);font-size:10px;color:var(--text-tertiary);text-decoration:none}</style></head><body><div class="row"><div class="card" style="background:var(--bg-sunk)"><b>Sunk</b><s>--bg-sunk</s></div><div class="card" style="background:var(--bg-base)"><b>Base</b><s>--bg-base</s></div><div class="card" style="background:var(--bg-raised);box-shadow:var(--shadow-card)"><b>Raised</b><s>--bg-raised</s></div><div class="card" style="background:var(--accent-quiet)"><b>Accent quiet</b><s>--accent-quiet</s></div></div></body></html>
