<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-base);color:var(--text-primary);font:var(--type-body)}.ramp{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:52px;border-radius:var(--radius-sm);border:1px solid var(--line-hairline)}.sw b{font:var(--type-caption);font-weight:500}.sw s{font:var(--type-meta);font-size:10px;color:var(--text-tertiary);text-decoration:none}.note{margin-top:12px;font:var(--type-footnote);color:var(--text-secondary)}</style></head><body><div class="ramp"><div class="sw"><i style="background:var(--accent)"></i><b>Rest</b><s>accent</s></div><div class="sw"><i style="background:var(--accent-hover)"></i><b>Hover</b><s>accent-hover</s></div><div class="sw"><i style="background:var(--accent-press)"></i><b>Press</b><s>accent-press</s></div><div class="sw"><i style="background:var(--accent-quiet)"></i><b>Quiet</b><s>accent-quiet</s></div><div class="sw"><i style="background:var(--accent-glow)"></i><b>Glow</b><s>accent-glow</s></div></div><p class="note">--accent on --bg-base: 4.9:1 · --text-accent on --bg-base: 6.2:1 · --accent-on on --accent: 6.1:1. Dark mode accent (#E5A063) on #100E0B: 9.8:1.</p></body></html>
