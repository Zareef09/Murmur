<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-base);color:var(--text-primary);font:var(--type-body)}.stack{display:flex;flex-direction:column;gap:6px}.stack span{font:var(--type-headline)}.stack em{font:var(--type-meta);font-size:10px;color:var(--text-tertiary);font-style:normal;margin-left:10px}</style></head><body><div class="stack"><span style="color:var(--text-primary)">Remind me to call mom<em>--text-primary</em></span><span style="color:var(--text-secondary)">Reminder · tomorrow 5:00 PM<em>--text-secondary</em></span><span style="color:var(--text-tertiary)">2h ago<em>--text-tertiary</em></span><span style="color:var(--text-accent)">Undo<em>--text-accent</em></span></div></body></html>
