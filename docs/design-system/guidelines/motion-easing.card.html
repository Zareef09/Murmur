<!-- @dsCard group="Motion" viewport="700x200" name="Easing curves" subtitle="Everything decelerates into place. No spring, no overshoot." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-base);color:var(--text-primary);font:var(--type-body)}.t{display:flex;flex-direction:column;gap:14px}.lane{position:relative;height:26px;border-radius:99px;background:var(--bg-sunk)}.dot{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--accent)}.l1{animation:go 2.4s var(--ease-exhale) infinite alternate}.l2{animation:go 2.4s var(--ease-inhale) infinite alternate}.l3{animation:go 2.4s var(--ease-settle) infinite alternate}@keyframes go{to{left:calc(100% - 22px)}}.cap{font:var(--type-meta);font-size:10px;color:var(--text-tertiary);margin-bottom:-8px}</style></head><body><div class="t"><div><div class="cap">--ease-exhale · cubic-bezier(.22,.61,.24,1) · the house curve</div><div class="lane"><span class="dot l1"></span></div></div><div><div class="cap">--ease-inhale · cubic-bezier(.42,0,.58,1) · breathing loops</div><div class="lane"><span class="dot l2"></span></div></div><div><div class="cap">--ease-settle · cubic-bezier(.16,.84,.28,1) · success landing</div><div class="lane"><span class="dot l3"></span></div></div></div></body></html>
