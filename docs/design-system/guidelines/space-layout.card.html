<!-- @dsCard group="Spacing" viewport="700x220" name="Screen gutters in use" subtitle="24px side margin, 56px between sections, safe areas respected." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-base);color:var(--text-primary);font:var(--type-body)}.phone{width:250px;height:170px;border-radius:var(--radius-xl);background:var(--bg-raised);border:1px solid var(--line-soft);padding:0 var(--gutter-screen);position:relative;overflow:hidden}.g{position:absolute;top:0;bottom:0;width:var(--gutter-screen);background:var(--accent-glow-faint)}.blk{height:14px;border-radius:6px;background:var(--line-soft)}.wrap{display:flex;gap:24px;align-items:center}.legend{font:var(--type-footnote);color:var(--text-secondary);max-width:34ch}</style></head><body><div class="wrap"><div class="phone"><div class="g" style="left:0"></div><div class="g" style="right:0"></div><div style="padding-top:26px;display:flex;flex-direction:column;gap:10px"><div class="blk" style="width:60%"></div><div class="blk" style="width:85%"></div></div><div style="margin-top:var(--space-10);display:flex;flex-direction:column;gap:10px"><div class="blk" style="width:70%"></div><div class="blk" style="width:45%"></div></div></div><p class="legend">--gutter-screen (24px) on both edges, --stack-section (56px) between groups. Content never touches the safe-area inset; the capture element is centred on the optical middle, not the geometric one.</p></div></body></html>
