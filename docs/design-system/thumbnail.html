<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;height:100%}
.wrap{width:1280px;height:854px;display:flex}
.main{flex:1;background:#F0E2CD;display:grid;place-items:center;position:relative;overflow:hidden}
.mark{display:flex;align-items:baseline;gap:26px;color:#4C2A12;font:200 210px/1 var(--font-core);letter-spacing:.06em}
.dot{width:44px;height:44px;border-radius:50%;background:var(--ember-600);margin-left:-12px}
.strip{width:22%;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style></head><body>
<div class="wrap">
  <div class="main"><div class="mark">murmur<span class="dot"></span></div></div>
  <div class="strip">
    <i style="background:var(--moss-300)"></i>
    <i style="background:var(--ember-400)"></i>
    <i style="background:var(--plum-600)"></i>
    <i style="background:var(--ember-700)"></i>
  </div>
</div>
</body></html>
